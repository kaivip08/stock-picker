# A股短线推荐系统配置文件

# 选股参数
selection:
  # 最终推荐数量
  top_n: 5
  # 最小流通市值（亿元），过滤小盘垃圾股
  min_market_cap: 30
  # 排除ST股
  exclude_st: true
  # 排除科创板（688开头）
  exclude_kcb: false
  # 排除北交所（8开头）
  exclude_bse: true

# 技术指标参数
indicators:
  # 均线周期
  ma_periods: [5, 10, 20, 60]
  # MACD参数
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  # RSI周期
  rsi_period: 14
  # RSI超卖阈值
  rsi_oversold: 30
  # RSI超买阈值
  rsi_overbought: 70
  # 成交量放大倍数阈值（相对于20日均量）
  volume_ratio_threshold: 1.5

# 策略权重（总和建议为1.0）
strategy_weights:
  volume_breakout: 0.25       # 放量突破
  ma_bullish: 0.20            # 均线多头排列
  macd_golden_cross: 0.20     # MACD金叉
  rsi_bounce: 0.15            # RSI超卖反弹
  price_momentum: 0.20        # 价格动量

# 数据参数
data:
  # 获取历史数据天数
  history_days: 120
  # 数据获取重试次数
  retry_times: 3
  # 请求间隔（秒）
  request_interval: 0.5

# 报告设置
report:
  # 输出目录
  output_dir: "./reports"
  # 是否保存到文件
  save_to_file: true
  # 输出格式：text, csv
  output_format: "text"
