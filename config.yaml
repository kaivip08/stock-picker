# A股短线推荐系统 v2.0 配置文件

# 选股参数
selection:
  top_n: 5
  pre_filter_count: 100      # 预筛选活跃股数量（越大分析越全面，但越慢）
  min_market_cap: 30         # 最小流通市值（亿元）
  exclude_st: true
  exclude_kcb: false         # 是否排除科创板（688）
  exclude_bse: true          # 是否排除北交所（8）

# 技术指标参数
indicators:
  # 均线
  ma_periods: [5, 10, 20, 60]
  # MACD
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  # RSI
  rsi_period: 14
  rsi_oversold: 30
  rsi_overbought: 70
  # KDJ
  kdj_n: 9
  kdj_m1: 3
  kdj_m2: 3
  # 量比阈值
  volume_ratio_threshold: 1.5

# 策略权重（7个策略，总和为1.0）
strategy_weights:
  volume_breakout: 0.20      # 放量突破
  ma_bullish: 0.15           # 均线多头排列
  macd_golden_cross: 0.15    # MACD金叉
  rsi_bounce: 0.10           # RSI超卖反弹
  price_momentum: 0.15       # 价格动量
  kdj_signal: 0.10           # KDJ信号
  obv_trend: 0.15            # OBV资金趋势

# 数据参数
data:
  history_days: 120
  retry_times: 5
  request_interval: 1.0

# 报告设置
report:
  output_dir: "./reports"
  save_to_file: true
  output_format: "text"      # text 或 csv
